<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAU Events — Campus Event Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <h1>HAU Events</h1>
      <p class="tagline">A running bulletin of what's on campus.</p>
    </div>
  </header>
 
  <main>
    <section class="controls" aria-label="Filter events">
      <input
        type="text"
        id="search"
        class="search-input"
        placeholder="Search events, orgs, locations…"
        aria-label="Search events"
      />
 
      <div class="chip-row" role="group" aria-label="Filter by category">
        <button class="chip is-active" data-category="all">All</button>
        <button class="chip" data-category="academic">Academic</button>
        <button class="chip" data-category="org">Org</button>
        <button class="chip" data-category="sports">Sports</button>
        <button class="chip" data-category="seminar">Seminar</button>
      </div>
    </section>
 
    <section id="event-list" class="event-list" aria-live="polite">
      <!-- Event groups are rendered here by script.js -->
    </section>
 
    <p id="empty-state" class="empty-state" hidden>
      Nothing matches that search. Try a different keyword or category.
    </p>
  </main>
 
  <footer class="site-footer">
    <p>Built for a Basic Programming in Web finals project.</p>
  </footer>
 
  <script src="events.js"></script>
  <script src="script.js"></script>
</body>
</html>
